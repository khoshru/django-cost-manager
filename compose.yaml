services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: costdb
      POSTGRES_USER: costuser
      POSTGRES_PASSWORD: costpass
    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: